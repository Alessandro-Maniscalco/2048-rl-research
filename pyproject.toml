[project]
name = "rl2048-lessons"
version = "0.1.0"
description = "Learn reinforcement learning one readable 2048 experiment at a time."
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "gymnasium>=1.1,<2",
  "matplotlib>=3.10,<4",
  "torch>=2.7,<3",
  "jupyterlab>=4.4,<5",
  "ipywidgets>=8.1,<9",
  "numba>=0.61,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "nbclient>=0.10,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl2048"]

[tool.pytest.ini_options]
testpaths = ["tests"]

